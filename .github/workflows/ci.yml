# Runs on every change and on main. Mirrors ci-template.yml, the reusable
# workflow the other Store Systems repositories call; a change to the
# template is made here first so it runs on this repository before anyone
# else sees it.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install from the lock
        run: npm ci
      - name: Compile
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: ignore
